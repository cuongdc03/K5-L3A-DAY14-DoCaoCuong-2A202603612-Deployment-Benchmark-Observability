# Railway — deploy từ thư mục 06-lab-complete:  cd 06-lab-complete && railway up
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên dashboard / `railway variables`,
# không ghi ở đây. Railway cấp PORT; CMD trong Dockerfile đã lắng nghe theo ${PORT}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
