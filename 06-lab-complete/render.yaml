# Render Blueprint — agent (Docker) + Redis-compatible Key Value
# Render → New → Blueprint → chọn repo, Blueprint path: 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: volatile-lru
    ipAllowList: []                  # chỉ cho phép kết nối nội bộ từ service trên Render
